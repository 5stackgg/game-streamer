Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
    Option "AllowEmptyInput" "true"
    Option "DontVTSwitch" "true"
    Option "DRI2" "true"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync 30-120
    # cap at 60: a higher advertised refresh makes cs2 show the "Settings
    # Recommendation" dialog, which blocks the headless batch render
    VertRefresh 50-60
    Option "DPMS" "false"
    ModeLine "2560x1440_60" 312.25 2560 2752 3024 3488 1440 1443 1448 1493 -hsync +vsync
EndSection

Section "Device"
    Identifier "Card0"
    Driver "nvidia"
    Option "ConnectedMonitor" "DFP-0"
    Option "UseDisplayDevice" "DFP-0"
    # Render nodes are headless; ignore any EDID from a monitor physically
    # attached to the GPU. Otherwise that display's modes (e.g. 2560x1440@120)
    # get advertised and cs2 shows a "Settings Recommendation" refresh-rate
    # dialog that blocks the batch render, and cs2 ignores synthetic input so it
    # cannot be clicked away. With UseEDID off we rely on the explicit ModeLine;
    # dropping NoHorizSyncCheck/NoVertRefreshCheck lets the HorizSync and
    # VertRefresh limits actually bound the advertised modes.
    Option "IgnoreEDID" "true"
    Option "UseEDID" "false"
    Option "ModeValidation" "NoMaxPClkCheck, NoEdidMaxPClkCheck, NoMaxSizeCheck, NoVirtualSizeCheck"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    Monitor "Monitor0"
    DefaultDepth 24
    Option "AllowEmptyInitialConfiguration" "true"
    SubSection "Display"
        Depth 24
        Modes "2560x1440_60"
        Virtual 2560 1440
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
EndSection
