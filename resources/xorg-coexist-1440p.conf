# Offscreen "coexist" X config: software-framebuffer dummy driver, NO GPU
# modeset/scanout. Used when the GPU's display is already owned by another X
# server (a host Ubuntu desktop, or a leftover Xorg) so the nvidia X can't claim
# it ("no screens found"). The streamer's X runs here on a free display (e.g. :1)
# while cs2 renders via Vulkan on the GPU's SHARED render node (renderD128) and
# vkcapture grabs the frame over its dmabuf socket (X-independent). cs2 captures
# fine — only Steam's CEF UI renders black, which we never capture (cosmetic).
# Lets a node double as a normal desktop AND run the streamer.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
    Option "AllowEmptyInput" "true"
    Option "DontVTSwitch" "true"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync 30-120
    VertRefresh 50-60
    Option "DPMS" "false"
    ModeLine "2560x1440_60" 312.25 2560 2752 3024 3488 1440 1443 1448 1493 -hsync +vsync
EndSection

Section "Device"
    Identifier "Card0"
    Driver "dummy"
    # Plenty for a single 1440p24 virtual screen (~14MB needed).
    VideoRam 256000
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    Monitor "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "2560x1440_60"
        Virtual 2560 1440
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
EndSection
