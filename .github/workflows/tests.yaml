name: Tests

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Some tests import .ts files directly, which Node runs without a flag
      # only from 22.18. check-latest keeps the runner's cached 22 from being
      # an older one.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          check-latest: true

      - name: Node can strip .ts types
        run: |
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 18)) {
              console.error(`node ${process.versions.node} cannot run .ts imports; the suite needs 22.18 or later`);
              process.exit(1);
            }
            console.log(`node ${process.versions.node}`);
          '

      # The suite stubs cs2, chromium, ffmpeg and xdotool, so it needs only
      # node and bash.
      - name: node --test
        run: node --test

  capture-flow-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install capture build and CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc pkg-config libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - name: Build the production consumer without a GPU
        run: |
          gcc -O2 -Wall -Wextra -Isrc/vkcapture/cuda-stub \
            -o /tmp/vkcapture-consumer src/vkcapture/vkcapture-consumer.c \
            $(pkg-config --cflags --libs glib-2.0 gio-2.0 gstreamer-1.0 gstreamer-app-1.0 gstreamer-video-1.0 gstreamer-cuda-1.0) -ldl
      - name: Detect a 60-to-5 FPS throughput gap and preserve encoded output
        run: |
          gcc -O2 -Wall -Wextra -Werror -o /tmp/flow-diag-test src/vkcapture/flow-diag.test.c $(pkg-config --cflags --libs gstreamer-1.0)
          /tmp/flow-diag-test
