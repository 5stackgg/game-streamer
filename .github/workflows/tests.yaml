name: Tests

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image installs Node from NodeSource's setup_22.x.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The suite stubs cs2, chromium, ffmpeg and xdotool, so it needs only
      # node and bash.
      - name: node --test
        run: node --test
